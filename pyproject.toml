[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-fetch-guard"
version = "0.1.0a1"
description = "Explicit ORM fetch policies for Django 4.2 and newer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Yassin Bahri", email = "131185064+yassinbahri@users.noreply.github.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "Django>=4.2,<6.2",
]

[project.optional-dependencies]
drf = ["djangorestframework>=3.16"]
test = [
    "djangorestframework>=3.16",
    "pytest>=8",
    "pytest-django>=4.9",
]
[project.urls]
Documentation = "https://github.com/yassinbahri/django-fetch-guard#readme"
Source = "https://github.com/yassinbahri/django-fetch-guard"
Issues = "https://github.com/yassinbahri/django-fetch-guard/issues"
Changelog = "https://github.com/yassinbahri/django-fetch-guard/blob/main/CHANGELOG.md"

[project.entry-points.pytest11]
fetch_guard = "fetch_guard.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
