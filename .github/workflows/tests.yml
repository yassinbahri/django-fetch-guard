name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            django: "Django>=4.2,<4.3"
          - python: "3.12"
            django: "Django>=5.2,<5.3"
          - python: "3.12"
            django: "Django>=6.0,<6.1"
          - python: "3.14"
            django: "Django>=6.1rc1,<6.2"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[test]" "${{ matrix.django }}"
      - run: python -m pytest
